name: Wayback Archive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger archive cron
        run: |
          curl -fsS -X GET \
            "$SITE_URL/api/archive" \
            -H "x-archive-key: ${{ secrets.WAYBACK_ARCHIVE_KEY }}" \
            -H "User-Agent: vercel-cron"
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://streamflix.dpdns.org' }}
