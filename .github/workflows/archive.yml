name: Wayback Archive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger archive cron
        run: |
          curl -fsS -X GET \
            "$SITE_URL/api/archive" \
            -H "x-archive-key: ${{ secrets.WAYBACK_ARCHIVE_KEY }}" \
            -H "User-Agent: github-actions-cron"
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://streamflix.dpdns.org' }}
